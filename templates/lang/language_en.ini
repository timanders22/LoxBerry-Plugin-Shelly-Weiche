[EINBINDUNG]
H="Loxone integration"
ERKLAERUNG="The Weiche delivers <b>nothing</b> to the Miniserver and needs no block there. If you want to see the values under <span class='sm-mono'>haus/klima/</span> in Loxone as well, get them through the LoxBerry MQTT gateway – like any other topic. The gateway keeps subscribing the raw device topics (<span class='sm-mono'>&lt;prefix&gt;/events/rpc</span>) as before; the Weiche changes nothing there."
S1="Step 1: switch on haus/klima"
S1_TEXT="In the MQTT tab set the checkbox “Report room climate under haus/klima/”, choose checkbox and name per device and save."
S2="Step 2: subscribe in the MQTT gateway"
S2_TEXT="In LoxBerry under MQTT Gateway, Subscriptions, enter the topic from the first column per name (or once <span class='sm-mono'>haus/klima/#</span> for all providers). The gateway turns every slash into an underscore; in Loxone Config create a Virtual Input per value with exactly the title from the second column."
KEINE="Nothing to enter yet: haus/klima is off or no saved device is checked."
SP_ABO="Gateway subscription"
SP_EINGANG="Title of the Virtual Input"
SP_BEDEUTUNG="Meaning"
S3="Step 3: check validity in the logic"
S3_TEXT="The values are retained and stay in the input even if a sensor falls silent. A value is valid only while <span class='sm-mono'>…_zeit</span> is younger than <span class='sm-mono'>…_frist</span> seconds (16200 = 4 h 30 min) and <span class='sm-mono'>haus_klima_zaehler_shellyweiche</span> changes within 120 seconds. If the last message is older, the Weiche itself sends -999 (temperature) or -1 (humidity) – so set MinVal of the inputs to -999 or -1, otherwise Loxone turns it into 0."
S4="Endpoint addresses (with token)"
S4_TEXT="Optional, for example for a Virtual Output: the first address makes the next minute run send all haus/klima values completely (after a consumer restarted); the second only checks the token and does nothing else. Without or with a wrong token the endpoint answers HTTP 403."
OHNE_TOKEN="No action token is set up – the endpoint rejects every action. Generate a token in the Settings tab."
SP_ZWECK="Purpose"
SP_ADRESSE="Address"
A_VOLL="send haus/klima completely in the next minute run"
A_SELBSTTEST="Self-test: check the token only"

