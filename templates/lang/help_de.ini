[HILFE]
K01="Shelly-Weiche"
K02="Shelly H&amp;T Gen3 melden Temperatur und Feuchte über ihr eigenes MQTT an den Broker des LoxBerry – aber nur in den kurzen Augenblicken, in denen sie aufwachen, und nicht zurückbehalten. Wer später fragt, bekommt nichts. Die Weiche hört mit, merkt sich je Gerät die letzten Werte und gibt sie auf Wunsch unter <span class='sm-mono'>haus/klima/&lt;name&gt;/…</span> an andere Plugins weiter (Raumklima, Sprachsteuerung, SignalBot)."
K03="Einrichten"
K04="Die Geräte brauchen in der Shelly-App eingeschaltetes MQTT mit diesem LoxBerry als Server. Nach der ersten Meldung erscheinen sie im Reiter Einstellungen. Im Reiter MQTT den Haken „Raumklima unter haus/klima/ melden“ setzen, je Gerät Haken und Namen wählen und speichern. Ab Werk ist alles aus."
K05="Gültigkeit"
K06="Ein Wert gilt nur, solange seine letzte Meldung jünger als 4 h 30 min ist; die Frist geht als frist mit (Regel des Hauses: ohne frist gilt eine Stunde). Die H&T Gen3 melden alle zwei Stunden und bei Überschreiten ihrer Schwelle (Temperatur 0,5 °C, Feuchte 5 %, am Gerät einstellbar); meldet ein Gerät länger nicht, sendet die Weiche selbst „ohne Aussage“ (Temperatur -999, Feuchte -1). Der Reiter Test zeigt den Meldetakt jedes Geräts."
K07="Was die Weiche nicht tut"
K08="Sie liefert dem Miniserver nichts, ändert keine Einstellung am Gerät und fasst die Abos des MQTT-Gateways nicht an. Sie überschreibt nie einen Namen unter haus/klima, den ein anderes Plugin hält, und räumt beim Ausschalten und bei der Deinstallation nur die Themen ab, die sie selbst gesendet hat."
