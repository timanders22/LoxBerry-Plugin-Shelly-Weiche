[EINBINDUNG]
H="Einbindung in Loxone"
ERKLAERUNG="Die Weiche liefert dem Miniserver <b>nichts</b> und braucht dort keinen Baustein. Wer die Werte unter <span class='sm-mono'>haus/klima/</span> auch in Loxone sehen will, holt sie über das MQTT-Gateway des LoxBerry – wie jedes andere Thema. Die Rohthemen der Geräte (<span class='sm-mono'>&lt;präfix&gt;/events/rpc</span>) abonniert das Gateway weiter wie bisher; daran ändert die Weiche nichts."
S1="Schritt 1: haus/klima einschalten"
S1_TEXT="Im Reiter MQTT den Haken „Raumklima unter haus/klima/ melden“ setzen, je Gerät Haken und Namen wählen und speichern."
S2="Schritt 2: im MQTT-Gateway abonnieren"
S2_TEXT="In LoxBerry unter MQTT-Gateway, Abonnements, je Name das Thema aus der ersten Spalte eintragen (oder einmal <span class='sm-mono'>haus/klima/#</span> für alle Anbieter). Das Gateway setzt jeden Schrägstrich zu einem Unterstrich; in Loxone Config legen Sie je Wert einen Virtuellen Eingang mit genau dem Titel aus der zweiten Spalte an."
KEINE="Noch nichts einzutragen: haus/klima ist aus, oder kein gespeichertes Gerät hat einen Haken."
SP_ABO="Abo im Gateway"
SP_EINGANG="Titel des Virtuellen Eingangs"
SP_BEDEUTUNG="Bedeutung"
S3="Schritt 3: Gültigkeit in der Logik prüfen"
S3_TEXT="Die Werte sind zurückbehalten und bleiben im Eingang stehen, auch wenn ein Fühler verstummt. Gültig ist ein Wert nur, solange <span class='sm-mono'>…_zeit</span> jünger als <span class='sm-mono'>…_frist</span> Sekunden ist (16200 = 4 h 30 min) und sich <span class='sm-mono'>haus_klima_zaehler_shellyweiche</span> binnen 120 Sekunden ändert. Liegt die letzte Meldung länger zurück, sendet die Weiche selbst -999 (Temperatur) bzw. -1 (Feuchte) – MinVal der Eingänge also auf -999 bzw. -1 setzen, sonst macht Loxone daraus 0."
S4="Adressen des Endpunkts (mit Token)"
S4_TEXT="Wahlfrei, etwa für einen Virtuellen Ausgang: die erste Adresse lässt den nächsten Minutenlauf alle haus/klima-Werte vollständig senden (nach einem Neustart eines Abnehmers); die zweite prüft nur das Token und tut sonst nichts. Ohne Token oder mit falschem Token antwortet der Endpunkt mit HTTP 403."
OHNE_TOKEN="Es ist kein Aktionstoken eingerichtet – der Endpunkt lehnt jede Aktion ab. Im Reiter Einstellungen ein Token erzeugen."
SP_ZWECK="Zweck"
SP_ADRESSE="Adresse"
A_VOLL="haus/klima beim nächsten Minutenlauf vollständig senden"
A_SELBSTTEST="Selbsttest: nur das Token prüfen"

