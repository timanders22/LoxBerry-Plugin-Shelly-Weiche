[GERAET]
H="Detected devices"
ERKLAERUNG="A device is recognised by its message, not by its name: a <span class='sm-mono'>NotifyFullStatus</span> or <span class='sm-mono'>NotifyStatus</span> notification under <span class='sm-mono'>&lt;prefix&gt;/events/rpc</span> carrying temperature or humidity. You set the prefix in the Shelly app (for example <span class='sm-mono'>shellyhtg3-Kueche</span>). Battery sensors only report while briefly awake – a new device appears here only after its first message. The device ID (it contains the MAC address) is not stored, only the model part in front of it."
