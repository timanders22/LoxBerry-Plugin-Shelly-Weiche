[HILFE]
K01="Shelly-Weiche"
K02="Shelly H&amp;T Gen3 report temperature and humidity via their own MQTT to the LoxBerry broker – but only in the short moments when they wake up, and not retained. Whoever asks later gets nothing. The Weiche listens, remembers the latest values per device and, if you want, passes them on to other plugins under <span class='sm-mono'>haus/klima/&lt;name&gt;/…</span> (Raumklima, Sprachsteuerung, SignalBot)."
K03="Setup"
K04="The devices need MQTT switched on in the Shelly app with this LoxBerry as server. After their first message they appear in the Settings tab. In the MQTT tab set the checkbox “Report room climate under haus/klima/”, choose checkbox and name per device and save. Everything is off by default."
K05="Validity"
K06="A value is valid only while its last message is younger than 4 h 30 min; the period is sent as frist (house rule: without frist one hour applies). The H&T Gen3 report every two hours and when their threshold is exceeded (temperature 0.5 °C, humidity 5 %, adjustable on the device); if a device does not report for longer, the Weiche itself sends “no statement” (temperature -999, humidity -1). The Test tab shows the reporting interval of every device."
K07="What the Weiche does not do"
K08="It delivers nothing to the Miniserver, changes no setting on the device and does not touch the MQTT gateway subscriptions. It never overwrites a name under haus/klima held by another plugin, and when switched off or uninstalled it only clears the topics it sent itself."
