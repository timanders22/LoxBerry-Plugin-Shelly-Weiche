[MQTT]
H="MQTT: haus/klima and listener subscriptions"
ERKLAERUNG="The Weiche logs in with the LoxBerry broker credentials (<span class='sm-mono'>config/system/general.json</span>, Mqtt.Brokeruser); the password is in no file of this plugin. It subscribes <span class='sm-mono'>+/events/rpc</span> and <span class='sm-mono'>+/+/events/rpc</span> and for every known device <span class='sm-mono'>&lt;prefix&gt;/online</span>; it only sends under <span class='sm-mono'>haus/klima/</span> and only with the checkbox switched on."
L_ABO="Additional subscription for devices with a deeper prefix (optional)"
H_ABO="Only needed if a prefix has more than one level (two slashes). Must end with <span class='sm-mono'>/events/rpc</span>; levels of A–Z, a–z, 0–9, _ . : - or exactly <span class='sm-mono'>+</span>; never <span class='sm-mono'>#</span>. Empty: only the two fixed subscriptions."
ABO_UNGUELTIG="The additional subscription %s is not allowed (must end with /events/rpc, levels of A–Z, a–z, 0–9, _ . : - or +, no #)."
