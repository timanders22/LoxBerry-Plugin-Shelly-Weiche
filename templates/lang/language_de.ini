[GERAET]
H="Erkannte Geräte"
ERKLAERUNG="Ein Gerät wird an seiner Meldung erkannt, nicht am Namen: eine Benachrichtigung <span class='sm-mono'>NotifyFullStatus</span> oder <span class='sm-mono'>NotifyStatus</span> unter <span class='sm-mono'>&lt;präfix&gt;/events/rpc</span> mit Temperatur oder Feuchte. Das Präfix stellen Sie in der Shelly-App ein (etwa <span class='sm-mono'>shellyhtg3-Kueche</span>). Batteriefühler melden nur beim kurzen Aufwachen – ein neues Gerät erscheint hier erst nach seiner ersten Meldung. Die Gerätekennung (sie enthält die MAC-Adresse) wird nicht gespeichert, nur der Modellteil davor."
