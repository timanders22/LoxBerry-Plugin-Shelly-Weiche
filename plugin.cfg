[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden - LoxBerry hielte das Plugin sonst fuer ein anderes, und jedes
# Update schluege fehl. Deshalb steht hier ein Projektname und eine
# noreply-Adresse und keine Person.
NAME=Shelly-Weiche Plugin Authors
EMAIL=shellyweiche@users.noreply.github.com

[PLUGIN]
VERSION=0.9.1
NAME=shellyweiche
FOLDER=shellyweiche
TITLE=Shelly-Weiche

# Adresse der Dokumentation: LoxBerry liest sie bei der Installation und zeigt sie als Knopf "Dokumentation".
# Besitzer und Repository wie in ARCHIVEURL der release.cfg.
WEBSITE=https://github.com/timanders22/LoxBerry-Plugin-Shelly-Weiche

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository
# timanders22/LoxBerry-Plugin-Shelly-Weiche, Zweig main). Erste Fassung 0.9.0:
# release.cfg und prerelease.cfg nennen 0.9.0 schon im ersten Commit, weil es
# keine aeltere Nummer gibt. Das Repository wird vor der Veroeffentlichung
# angelegt; bis der Tag v0.9.0 steht, antwortet die Archivadresse mit 404 -
# installiert hat bis dahin niemand, denn das Archiv entsteht erst mit dem Tag
# (Regeln/11, Berichtigung vom 12.11.2026).
# Bei jedem Release: VERSION hier und in release.cfg/prerelease.cfg erhoehen,
# beide Adressen dort auf den neuen Tag setzen, den Tag vX.Y.Z anlegen und
# nachpruefen, dass er wirklich existiert.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Shelly-Weiche/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Shelly-Weiche/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Wie bei den uebrigen Plugins dieses Hauses. Das Plugin ist reines PHP und
# braucht nichts nachzuinstallieren.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl bricht bei Ueberschreitung ab.
LB_MAXIMUM=false
# false schaltet die Architekturpruefung ab - das Plugin ist reines PHP und
# laeuft ueberall.
ARCHITECTURE=false
